# Qwakk Pond Vault: Foundry project.
# Based on the foundry template of create-qorechain-dapp@0.14.0
# (templates/foundry/foundry.toml): same compiler, optimizer and named RPCs.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
# The tests read the ML-DSA-87 vectors generated by `npm run vectors` in cli/.
# The deploy script writes nothing to disk.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 1024

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

# Public QoreChain EVM endpoints. Use them by name:
#   forge script ... --rpc-url qorechain_testnet
[rpc_endpoints]
qorechain = "https://evm.qore.host"
qorechain_testnet = "https://evm-testnet.qore.host"
