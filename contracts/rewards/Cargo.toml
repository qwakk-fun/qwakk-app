[package]
name = "qwakk-rewards"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Qwakk liquidity rewards: per-stage, self-funded Merkle claims on QoreChain Diana"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Build without the entry points, for use as a dependency.
library = []

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true

[dependencies]
# Default features only ("exports", "iterator", "std"): no staking, stargate or
# cosmwasm_x_y capability is required from the chain.
cosmwasm-std = "2.2"
cosmwasm-schema = "2.2"
cw-storage-plus = "2.0"
cw2 = "2.0"
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
thiserror = "1.0"

[dev-dependencies]
cw-multi-test = "2.5"
serde = { version = "1.0", features = ["derive"] }
