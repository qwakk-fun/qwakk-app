services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qora-web
    depends_on:
      indexer:
        condition: service_started
    environment:
      QORA_INDEXER_URL: http://indexer:4400
      PORT: 3000
    ports:
      - "3001:3000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: qora-postgres
    environment:
      POSTGRES_DB: qora
      POSTGRES_USER: qora
      POSTGRES_PASSWORD: qora_local
    ports:
      - "5438:5432"
    volumes:
      - qora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qora -d qora"]
      interval: 5s
      timeout: 5s
      retries: 12

  indexer:
    build:
      context: .
      dockerfile: indexer/Dockerfile
    container_name: qora-indexer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://qora:qora_local@postgres:5432/qora
      QORECHAIN_REST_URL: https://api-testnet.qore.host
      QORECHAIN_RPC_URL: https://rpc-testnet.qore.host
      QORA_INDEXER_PORT: 4400
    ports:
      - "4400:4400"
    restart: unless-stopped

volumes:
  qora-postgres-data:
