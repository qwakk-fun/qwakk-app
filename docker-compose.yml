# Pinned so container and volume names do not depend on the folder name.
name: qwakk

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwakk-web
    depends_on:
      indexer:
        condition: service_healthy
    environment:
      QWAKK_PROCESS_ROLE: web
      QWAKK_INDEXER_URL: http://indexer:4400
      QORECHAIN_REST_URL: https://api-testnet.qore.host
      QORECHAIN_RPC_URL: https://rpc-testnet.qore.host
      PORT: 3000
    ports:
      - "3001:3000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: qwakk-postgres
    environment:
      POSTGRES_DB: qwakk
      POSTGRES_USER: qwakk
      POSTGRES_PASSWORD: qwakk_local
    ports:
      - "5438:5432"
    volumes:
      - qwakk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwakk -d qwakk"]
      interval: 5s
      timeout: 5s
      retries: 12

  indexer:
    build:
      context: .
      dockerfile: indexer/Dockerfile
    container_name: qwakk-indexer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QWAKK_PROCESS_ROLE: indexer
      DATABASE_URL: postgresql://qwakk:qwakk_local@postgres:5432/qwakk
      QORECHAIN_REST_URL: https://api-testnet.qore.host
      QORECHAIN_RPC_URL: https://rpc-testnet.qore.host
      QWAKK_INDEXER_PORT: 4400
    ports:
      - "4400:4400"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4400/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  qwakk-postgres-data:
